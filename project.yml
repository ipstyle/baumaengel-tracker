name: BaumaengelTracker

options:
  bundleIdPrefix: com.ip-style
  createIntermediateGroups: true
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  BaumaengelTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BaumaengelTracker
    settings:
      base:
        PRODUCT_NAME: BaumaengelTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.ip-style.baumaengeltracker
        INFOPLIST_FILE: BaumaengelTracker/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AkzentFarbe
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
